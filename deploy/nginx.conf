server {
    listen 8080;
    root /usr/share/nginx/html;
    port_in_redirect off;
    absolute_redirect off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location = /classsnag { return 308 /classsnag/$is_args$args; }
    if ($request_uri ~ "^/classsnag/index\.html(?:\?|$)") { return 308 /classsnag/$is_args$args; }
    location = /classsnag/privacy { return 308 /classsnag/privacy.html; }
    location /classsnag/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
