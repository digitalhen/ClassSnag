<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ClassSnag</title>
    <script type="text/javascript" src="popup.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img class="brand-logo" src="assets/icon-128.png" width="56" height="56" alt="">
        <h1>ClassSnag</h1>
        <p class="tagline">Get another shot at your favorite class</p>
      </div>

      <div class="setting-group">
        <div class="setting-header">
          <label class="toggle-label">
            <input id="refreshEnabled" type="checkbox" class="toggle-input" />
            <span class="toggle-slider"></span>
            <span class="label-text">Auto Refresh</span>
          </label>
        </div>
        <div class="setting-detail">
          <label class="range-label">
            Refresh every <span id="refreshAmountText" class="highlight">30</span> seconds
            <input id="refreshAmount" type="range" min="1" max="60" value="30" class="range-input">
          </label>
          <p class="description">Keep checking for spots when class is full or not yet open</p>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-header">
          <label class="toggle-label">
            <input id="addToBasketEnabled" type="checkbox" class="toggle-input" />
            <span class="toggle-slider"></span>
            <span class="label-text">Auto Book</span>
          </label>
        </div>
        <div class="setting-detail">
          <p class="description">Request a booking when a spot opens. Success is confirmed by the booking site.</p>
        </div>
      </div>

      <div class="info-section">
        <p class="info-text">Sign in to your gym’s VirtuaGym site and open a class. Keep its tab open.</p>
      </div>
    </div>
  </body>
</html>
