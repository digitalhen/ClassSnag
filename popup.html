<!doctype html>
<html>
  <head>
    <title>WalBot</title>
    <script type="text/javascript" src="popup.js"></script>
    <style>
	    button {
	    	padding: 5%;
	    	margin: 5px;
	    	width: 90%;
	    }
	    label {
	    	margin: 10px 5px;
	    }
    </style>
  </head>
  <body>
    <h1>YMCABot</h1>

    <label>Refresh: <input id="refreshEnabled" type="checkbox" /></label>
    <br>
    <label>Every (<span id="refreshAmountText">30</span>) second</label>
    <input id="refreshAmount" type="range" min="1" max="60" value="30">

    <br>
    <br>
    <label>SMS: <input id="smsEnabled" type="checkbox" /></label>
    <br>
    <label>Number: <input id="smsNumber" type="number" name="smsNumber" /></label>
    <br>
    <br>
    <label>Reserve class: <input id="addToBasketEnabled" type="checkbox" /></label>
  </body>
</html>
